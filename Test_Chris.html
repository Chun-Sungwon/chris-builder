<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10172b">
  <title>테트리스</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #10172b;
      color: #f7f8fc;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at top, #25345a, #10172b 65%);
    }

    main {
      width: min(100%, 560px);
      padding: 24px;
      border: 1px solid #39466a;
      border-radius: 20px;
      background: rgba(18, 27, 49, .94);
      box-shadow: 0 24px 70px #05091499;
    }

    h1 { margin: 0 0 18px; text-align: center; letter-spacing: .12em; }

    .game {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 18px;
    }

    canvas {
      display: block;
      border: 2px solid #526184;
      border-radius: 8px;
      background: #0b1120;
    }

    #board { width: min(60vw, 240px); height: auto; }
    #next { width: 120px; height: 120px; }

    aside { min-width: 120px; }
    .label { margin: 0 0 5px; color: #aab8ff; font-size: .82rem; }
    .stat { margin: 0 0 16px; font-size: 1.35rem; font-weight: 700; }

    .buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px; }
    button {
      min-height: 42px;
      padding: 9px 16px;
      border: 1px solid #7384ba;
      border-radius: 10px;
      background: #26375f;
      color: inherit;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }
    button:hover { background: #344a7c; }
    button:focus-visible { outline: 3px solid #aab8ff; outline-offset: 2px; }

    #message { min-height: 1.5em; margin: 14px 0 0; text-align: center; color: #ffd479; font-weight: 700; }
    .help { margin: 8px 0 0; color: #aab2c6; text-align: center; font-size: .9rem; line-height: 1.6; }

    @media (max-width: 430px) {
      body { padding: 12px; }
      main { padding: 18px 12px; }
      .game { gap: 12px; }
      aside { min-width: 95px; }
      #next { width: 95px; height: 95px; }
      .stat { font-size: 1.1rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>테트리스</h1>
    <section class="game" aria-label="테트리스 게임">
      <canvas id="board" width="240" height="480" aria-label="게임 보드"></canvas>
      <aside>
        <p class="label">다음 블록</p>
        <canvas id="next" width="120" height="120" aria-label="다음 블록 미리 보기"></canvas>
        <p class="label">점수</p>
        <p class="stat" id="score">0</p>
        <p class="label">지운 줄</p>
        <p class="stat" id="lines">0</p>
        <p class="label">레벨</p>
        <p class="stat" id="level">1</p>
      </aside>
    </section>
    <div class="buttons">
      <button id="start" type="button">새 게임</button>
      <button id="pause" type="button">일시 정지</button>
    </div>
    <p id="message" role="status" aria-live="polite">새 게임을 시작하세요.</p>
    <p class="help">← → 이동 · ↓ 내리기 · ↑ 회전 · Space 빠르게 내리기 · P 일시 정지</p>
  </main>
  <script>
    "use strict";

    const COLS = 10;
    const ROWS = 20;
    const CELL = 24;
    const SHAPES = [
      { color: "#55d8e8", cells: [[1, 0], [1, 1], [1, 2], [1, 3]] },
      { color: "#6c83ff", cells: [[0, 0], [0, 1], [1, 1], [2, 1]] },
      { color: "#ffad5c", cells: [[2, 0], [0, 1], [1, 1], [2, 1]] },
      { color: "#ffe06a", cells: [[1, 0], [2, 0], [1, 1], [2, 1]] },
      { color: "#62d994", cells: [[1, 0], [2, 0], [0, 1], [1, 1]] },
      { color: "#bd83ff", cells: [[1, 0], [0, 1], [1, 1], [2, 1]] },
      { color: "#ff6d83", cells: [[0, 0], [1, 0], [1, 1], [2, 1]] }
    ];

    const boardCanvas = document.querySelector("#board");
    const boardContext = boardCanvas.getContext("2d");
    const nextCanvas = document.querySelector("#next");
    const nextContext = nextCanvas.getContext("2d");
    const scoreElement = document.querySelector("#score");
    const linesElement = document.querySelector("#lines");
    const levelElement = document.querySelector("#level");
    const messageElement = document.querySelector("#message");
    const pauseButton = document.querySelector("#pause");

    let board;
    let current;
    let next;
    let score = 0;
    let clearedLines = 0;
    let level = 1;
    let dropCounter = 0;
    let lastTime = 0;
    let running = false;
    let paused = false;
    let animationId = 0;

    function randomShape() {
      const shape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
      return { cells: shape.cells.map(([x, y]) => [x, y]), color: shape.color };
    }

    function spawnPiece() {
      current = { ...next, x: 3, y: 0 };
      next = randomShape();
      drawNext();
      if (collides(current, 0, 0, current.cells)) {
        running = false;
        messageElement.textContent = "게임 종료! 새 게임을 눌러 다시 시작하세요.";
      }
    }

    function collides(piece, dx, dy, cells) {
      return cells.some(([x, y]) => {
        const col = piece.x + x + dx;
        const row = piece.y + y + dy;
        return col < 0 || col >= COLS || row >= ROWS || (row >= 0 && board[row][col]);
      });
    }

    function drawCell(context, x, y, color, size) {
      context.fillStyle = color;
      context.fillRect(x * size + 1, y * size + 1, size - 2, size - 2);
      context.fillStyle = "rgba(255,255,255,.2)";
      context.fillRect(x * size + 2, y * size + 2, size - 4, 3);
    }

    function draw() {
      boardContext.fillStyle = "#0b1120";
      boardContext.fillRect(0, 0, boardCanvas.width, boardCanvas.height);
      boardContext.strokeStyle = "#202b43";
      boardContext.lineWidth = 1;
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          boardContext.strokeRect(x * CELL + .5, y * CELL + .5, CELL, CELL);
          if (board[y][x]) drawCell(boardContext, x, y, board[y][x], CELL);
        }
      }
      if (current) {
        for (const [x, y] of current.cells) {
          const row = current.y + y;
          if (row >= 0) drawCell(boardContext, current.x + x, row, current.color, CELL);
        }
      }
    }

    function drawNext() {
      nextContext.fillStyle = "#0b1120";
      nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
      const xs = next.cells.map(([x]) => x);
      const ys = next.cells.map(([, y]) => y);
      const offsetX = (4 - (Math.max(...xs) - Math.min(...xs) + 1)) / 2 - Math.min(...xs);
      const offsetY = (4 - (Math.max(...ys) - Math.min(...ys) + 1)) / 2 - Math.min(...ys);
      for (const [x, y] of next.cells) drawCell(nextContext, x + offsetX, y + offsetY, next.color, 24);
    }

    function updateStats() {
      scoreElement.textContent = String(score);
      linesElement.textContent = String(clearedLines);
      levelElement.textContent = String(level);
    }

    function lockPiece() {
      for (const [x, y] of current.cells) {
        const row = current.y + y;
        if (row < 0) {
          running = false;
          messageElement.textContent = "게임 종료! 새 게임을 눌러 다시 시작하세요.";
          return;
        }
        board[row][current.x + x] = current.color;
      }

      let removed = 0;
      board = board.filter(row => {
        if (row.every(Boolean)) {
          removed++;
          return false;
        }
        return true;
      });
      while (board.length < ROWS) board.unshift(Array(COLS).fill(0));
      if (removed) {
        const points = [0, 100, 300, 500, 800][removed] || removed * 200;
        score += points * level;
        clearedLines += removed;
        level = Math.floor(clearedLines / 10) + 1;
        updateStats();
      }
      spawnPiece();
    }

    function moveDown(manual) {
      if (collides(current, 0, 1, current.cells)) {
        lockPiece();
      } else {
        current.y++;
        if (manual) {
          score++;
          updateStats();
        }
      }
      dropCounter = 0;
      draw();
    }

    function rotate(direction) {
      const rotated = current.cells.map(([x, y]) => direction > 0 ? [3 - y, x] : [y, 3 - x]);
      const minX = Math.min(...rotated.map(([x]) => x));
      const maxX = Math.max(...rotated.map(([x]) => x));
      const normalized = rotated.map(([x, y]) => [x - minX, y]);
      const width = maxX - minX + 1;
      const offsets = [0, -1, 1, -2, 2];
      for (const offset of offsets) {
        if (!collides(current, offset, 0, normalized) &&
            current.x + offset + width <= COLS) {
          current.x += offset;
          current.cells = normalized;
          draw();
          return;
        }
      }
    }

    function hardDrop() {
      let distance = 0;
      while (!collides(current, 0, 1, current.cells)) {
        current.y++;
        distance++;
      }
      score += distance * 2;
      updateStats();
      lockPiece();
      draw();
    }

    function frame(time = 0) {
      if (!running || paused) return;
      const delta = time - lastTime;
      lastTime = time;
      dropCounter += delta;
      if (dropCounter > Math.max(100, 800 - (level - 1) * 65)) moveDown(false);
      draw();
      animationId = requestAnimationFrame(frame);
    }

    function startGame() {
      cancelAnimationFrame(animationId);
      board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
      score = 0;
      clearedLines = 0;
      level = 1;
      dropCounter = 0;
      lastTime = 0;
      running = true;
      paused = false;
      next = randomShape();
      updateStats();
      pauseButton.textContent = "일시 정지";
      messageElement.textContent = "게임 중";
      spawnPiece();
      draw();
      animationId = requestAnimationFrame(frame);
    }

    function togglePause() {
      if (!running) return;
      paused = !paused;
      pauseButton.textContent = paused ? "계속하기" : "일시 정지";
      messageElement.textContent = paused ? "일시 정지됨" : "게임 중";
      if (!paused) {
        lastTime = 0;
        animationId = requestAnimationFrame(frame);
      } else {
        cancelAnimationFrame(animationId);
      }
    }

    document.addEventListener("keydown", event => {
      if (!running || paused) {
        if (event.key.toLowerCase() === "p") togglePause();
        return;
      }
      if (["ArrowLeft", "ArrowRight", "ArrowDown", "ArrowUp", " "].includes(event.key)) event.preventDefault();
      switch (event.key) {
        case "ArrowLeft":
          if (!collides(current, -1, 0, current.cells)) current.x--;
          break;
        case "ArrowRight":
          if (!collides(current, 1, 0, current.cells)) current.x++;
          break;
        case "ArrowDown":
          moveDown(true);
          break;
        case "ArrowUp":
        case "x":
        case "X":
          rotate(1);
          break;
        case "z":
        case "Z":
          rotate(-1);
          break;
        case " ":
          hardDrop();
          break;
        case "p":
        case "P":
          togglePause();
          break;
      }
      draw();
    });

    document.querySelector("#start").addEventListener("click", startGame);
    pauseButton.addEventListener("click", togglePause);
    board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    next = randomShape();
    drawNext();
    draw();
  </script>
</body>
</html>
