<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chris Tetris</title>
  <style>
    :root {
      --bg: #090b18;
      --panel: #15182d;
      --text: #f7f8ff;
      --accent: #6cf2c2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background:
        radial-gradient(circle at top, #252a56 0, var(--bg) 58%);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .game {
      display: grid;
      grid-template-columns: minmax(0, 300px) 150px;
      gap: 18px;
      width: min(96vw, 468px);
      align-items: start;
    }
    .board-wrap {
      position: relative;
      border: 3px solid #7d83b8;
      border-radius: 8px;
      box-shadow: 0 16px 50px #0009;
      background: #080913;
      line-height: 0;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
    }
    .side {
      display: grid;
      gap: 12px;
    }
    .panel {
      border: 1px solid #353a67;
      border-radius: 8px;
      background: var(--panel);
      padding: 12px;
    }
    .panel h2 {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    .score {
      font-size: 28px;
      font-weight: 800;
    }
    #next { width: 100%; height: 110px; }
    button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 12px;
      background: var(--accent);
      color: #10151a;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: #090b18cc;
      backdrop-filter: blur(3px);
      opacity: 1;
      transition: opacity .15s;
      line-height: normal;
      text-align: center;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .overlay strong {
      display: block;
      margin-bottom: 8px;
      font-size: 34px;
    }
    .mobile {
      display: none;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      width: 100%;
      grid-column: 1 / -1;
    }
    .mobile button { min-height: 50px; padding: 4px; }
    @media (max-width: 520px) {
      .game { grid-template-columns: minmax(0, 300px) 112px; gap: 8px; }
      .mobile { display: grid; }
    }
  </style>
</head>
<body>
  <main class="game" aria-label="테트리스 게임">
    <div class="board-wrap">
      <canvas id="board" width="300" height="600" aria-label="게임 보드"></canvas>
      <div class="overlay" id="overlay">
        <div>
          <strong id="overlayTitle">Chris Tetris</strong>
          <span id="overlayText">시작 버튼을 누르세요</span>
        </div>
      </div>
    </div>
    <aside class="side">
      <div class="panel">
        <h2>Score</h2>
        <div class="score" id="score">0</div>
      </div>
      <div class="panel">
        <h2>Lines</h2>
        <div class="score" id="lines">0</div>
      </div>
      <div class="panel">
        <h2>Next</h2>
        <canvas id="next" width="126" height="110"></canvas>
      </div>
      <button id="start">Start</button>
    </aside>
    <div class="mobile" aria-label="모바일 조작">
      <button data-action="left" aria-label="왼쪽">◀</button>
      <button data-action="rotate" aria-label="회전">↻</button>
      <button data-action="down" aria-label="아래">▼</button>
      <button data-action="right" aria-label="오른쪽">▶</button>
      <button data-action="drop" aria-label="하드 드롭">⇊</button>
    </div>
  </main>

  <script>
    const COLS = 10;
    const ROWS = 20;
    const SIZE = 30;
    const boardCanvas = document.getElementById("board");
    const boardContext = boardCanvas.getContext("2d");
    const nextCanvas = document.getElementById("next");
    const nextContext = nextCanvas.getContext("2d");
    const scoreElement = document.getElementById("score");
    const linesElement = document.getElementById("lines");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlayText = document.getElementById("overlayText");
    const startButton = document.getElementById("start");

    const pieces = {
      I: { shape: [[1,1,1,1]], color: "#42d6ff" },
      J: { shape: [[1,0,0],[1,1,1]], color: "#6574ff" },
      L: { shape: [[0,0,1],[1,1,1]], color: "#ffad42" },
      O: { shape: [[1,1],[1,1]], color: "#ffe15a" },
      S: { shape: [[0,1,1],[1,1,0]], color: "#58db79" },
      T: { shape: [[0,1,0],[1,1,1]], color: "#ba67ff" },
      Z: { shape: [[1,1,0],[0,1,1]], color: "#ff5f76" }
    };
    const types = Object.keys(pieces);
    let grid;
    let current;
    let next;
    let score = 0;
    let lines = 0;
    let timer = null;
    let running = false;
    let dropInterval = 700;

    function emptyGrid() {
      return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
    }

    function randomPiece() {
      const type = types[Math.floor(Math.random() * types.length)];
      const source = pieces[type];
      return {
        type,
        shape: source.shape.map(row => [...row]),
        color: source.color,
        x: Math.floor((COLS - source.shape[0].length) / 2),
        y: 0
      };
    }

    function collides(piece, offsetX = 0, offsetY = 0, shape = piece.shape) {
      for (let y = 0; y < shape.length; y++) {
        for (let x = 0; x < shape[y].length; x++) {
          if (!shape[y][x]) continue;
          const newX = piece.x + x + offsetX;
          const newY = piece.y + y + offsetY;
          if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
          if (newY >= 0 && grid[newY][newX]) return true;
        }
      }
      return false;
    }

    function merge() {
      current.shape.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value) {
            const boardY = current.y + y;
            if (boardY >= 0) grid[boardY][current.x + x] = current.color;
          }
        });
      });
    }

    function clearLines() {
      let cleared = 0;
      for (let y = ROWS - 1; y >= 0; y--) {
        if (grid[y].every(Boolean)) {
          grid.splice(y, 1);
          grid.unshift(Array(COLS).fill(null));
          cleared++;
          y++;
        }
      }
      if (cleared) {
        lines += cleared;
        score += [0, 100, 300, 500, 800][cleared] * Math.max(1, Math.floor(lines / 10) + 1);
        dropInterval = Math.max(150, 700 - Math.floor(lines / 10) * 70);
      }
    }

    function spawn() {
      current = next || randomPiece();
      next = randomPiece();
      current.x = Math.floor((COLS - current.shape[0].length) / 2);
      current.y = 0;
      if (collides(current)) endGame();
      drawNext();
    }

    function move(dx, dy) {
      if (!running) return;
      if (!collides(current, dx, dy)) {
        current.x += dx;
        current.y += dy;
        draw();
        return true;
      }
      if (dy > 0) lockPiece();
      return false;
    }

    function lockPiece() {
      merge();
      clearLines();
      spawn();
      updateStats();
      draw();
    }

    function rotate() {
      if (!running) return;
      const rotated = current.shape[0].map((_, i) =>
        current.shape.map(row => row[i]).reverse()
      );
      for (const kick of [0, -1, 1, -2, 2]) {
        if (!collides(current, kick, 0, rotated)) {
          current.shape = rotated;
          current.x += kick;
          draw();
          return;
        }
      }
    }

    function hardDrop() {
      if (!running) return;
      let distance = 0;
      while (!collides(current, 0, 1)) {
        current.y++;
        distance++;
      }
      score += distance * 2;
      lockPiece();
    }

    function drawBlock(context, x, y, color, size = SIZE) {
      context.fillStyle = color;
      context.fillRect(x * size + 1, y * size + 1, size - 2, size - 2);
      context.fillStyle = "#ffffff22";
      context.fillRect(x * size + 3, y * size + 3, size - 6, 3);
    }

    function draw() {
      boardContext.fillStyle = "#080913";
      boardContext.fillRect(0, 0, boardCanvas.width, boardCanvas.height);
      boardContext.strokeStyle = "#171a31";
      boardContext.lineWidth = 1;
      for (let x = 0; x <= COLS; x++) {
        boardContext.beginPath();
        boardContext.moveTo(x * SIZE, 0);
        boardContext.lineTo(x * SIZE, boardCanvas.height);
        boardContext.stroke();
      }
      for (let y = 0; y <= ROWS; y++) {
        boardContext.beginPath();
        boardContext.moveTo(0, y * SIZE);
        boardContext.lineTo(boardCanvas.width, y * SIZE);
        boardContext.stroke();
      }
      grid.forEach((row, y) => row.forEach((color, x) => {
        if (color) drawBlock(boardContext, x, y, color);
      }));
      if (current) {
        current.shape.forEach((row, y) => row.forEach((value, x) => {
          if (value) drawBlock(boardContext, current.x + x, current.y + y, current.color);
        }));
      }
    }

    function drawNext() {
      nextContext.fillStyle = "#15182d";
      nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
      if (!next) return;
      const block = 24;
      const width = next.shape[0].length * block;
      const height = next.shape.length * block;
      const offsetX = (nextCanvas.width - width) / 2;
      const offsetY = (nextCanvas.height - height) / 2;
      next.shape.forEach((row, y) => row.forEach((value, x) => {
        if (value) {
          nextContext.fillStyle = next.color;
          nextContext.fillRect(offsetX + x * block + 1, offsetY + y * block + 1, block - 2, block - 2);
        }
      }));
    }

    function updateStats() {
      scoreElement.textContent = score;
      linesElement.textContent = lines;
    }

    function scheduleDrop() {
      clearTimeout(timer);
      if (!running) return;
      timer = setTimeout(() => {
        move(0, 1);
        scheduleDrop();
      }, dropInterval);
    }

    function startGame() {
      clearTimeout(timer);
      grid = emptyGrid();
      score = 0;
      lines = 0;
      dropInterval = 700;
      running = true;
      next = randomPiece();
      spawn();
      updateStats();
      overlay.classList.add("hidden");
      startButton.textContent = "Restart";
      draw();
      scheduleDrop();
    }

    function endGame() {
      running = false;
      clearTimeout(timer);
      overlayTitle.textContent = "Game Over";
      overlayText.textContent = `Score: ${score}  ·  Lines: ${lines}`;
      overlay.classList.remove("hidden");
    }

    document.addEventListener("keydown", event => {
      const actions = {
        ArrowLeft: () => move(-1, 0),
        ArrowRight: () => move(1, 0),
        ArrowDown: () => move(0, 1),
        ArrowUp: () => rotate(),
        " ": () => hardDrop()
      };
      if (actions[event.key]) {
        event.preventDefault();
        actions[event.key]();
      }
    });

    document.querySelectorAll("[data-action]").forEach(button => {
      button.addEventListener("click", () => {
        const action = button.dataset.action;
        if (action === "left") move(-1, 0);
        if (action === "right") move(1, 0);
        if (action === "down") move(0, 1);
        if (action === "rotate") rotate();
        if (action === "drop") hardDrop();
      });
    });

    startButton.addEventListener("click", startGame);
    grid = emptyGrid();
    draw();
  </script>
</body>
</html>
